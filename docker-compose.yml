services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cvg_diagnostics
      POSTGRES_USER: cvg
      POSTGRES_PASSWORD: cvg_dev
    ports:
      - "54329:5432"
    volumes:
      - cvg-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvg -d cvg_diagnostics"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cvg-minio
      MINIO_ROOT_PASSWORD: cvg-minio-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cvg-minio:/data

volumes:
  cvg-postgres:
  cvg-minio:
